name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked --all-targets

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # The shipping profile uses LTO, a single codegen unit, and symbol
      # stripping, none of which the debug builds above exercise.
      - name: Build release
        run: cargo build --locked --release

  minimum-rust-version:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # Pinned to the rust-version declared in Cargo.toml, so raising the floor
      # stays a deliberate edit rather than something a dependency does to us.
      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
