name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked --all-targets

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # The shipping profile uses LTO, a single codegen unit, and symbol
      # stripping, none of which the debug builds above exercise.
      - name: Build release
        run: cargo build --locked --release

  bundle:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build Flourish.app
        run: scripts/bundle-macos.sh --universal

      # The bundle is only useful if macOS agrees it is one, so check the
      # things a broken bundle gets wrong: a malformed plist, a missing agent
      # flag, a signature that does not verify, or a thin binary.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          app=target/bundle/Flourish.app
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -f "$app/Contents/Resources/Flourish.icns"
          [ "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = "true" ]
          lipo -archs "$app/Contents/MacOS/flourish" | tee /dev/stderr | grep -q "arm64"
          lipo -archs "$app/Contents/MacOS/flourish" | grep -q "x86_64"

      # Ad-hoc signed, so useful for testing but not distributable. See
      # packaging/macos/README.md.
      - uses: actions/upload-artifact@v4
        with:
          name: Flourish-macos-universal
          path: target/bundle/Flourish.app
          if-no-files-found: error

  minimum-rust-version:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # Pinned to the rust-version declared in Cargo.toml, so raising the floor
      # stays a deliberate edit rather than something a dependency does to us.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Run directly rather than through an action that reports via the Checks
      # API, so the ignore list and its rationale live in .cargo/audit.toml
      # where they get reviewed alongside the code.
      # Vulnerabilities fail the build. Unmaintained-crate notices are reported
      # but do not, because the GTK3 bindings tray-icon needs on Linux are
      # archived upstream with no drop-in replacement.
      - name: Audit
        run: cargo audit
