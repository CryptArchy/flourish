[package]
name = "flourish"
version = "0.1.0"
edition = "2024"
# Floor is set by wgpu 30, which declares 1.87.
rust-version = "1.87"
description = "A lightweight runner for presentation flourishes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CryptArchy/flourish"
homepage = "https://github.com/CryptArchy/flourish"
keywords = ["presentation", "menubar", "shader", "wgpu", "overlay"]
categories = ["visualization", "gui"]

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
global-hotkey = "0.8"
pollster = "0.4"
rfd = "0.17"
thiserror = "2"
tray-icon = "0.24"
wgpu = "30"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
