[package]
name = "flourish"
version = "0.1.0"
edition = "2024"
# wgpu 30 declares 1.87, but rfd's Linux xdg-portal backend needs `Default`
# for raw pointers and declares no rust-version of its own, so the real floor
# is higher than any dependency admits. The MSRV job in CI is what proves this
# number; do not raise it without a build failure that demands it.
rust-version = "1.88"
description = "A lightweight runner for presentation flourishes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CryptArchy/flourish"
homepage = "https://github.com/CryptArchy/flourish"
keywords = ["presentation", "menubar", "shader", "wgpu", "overlay"]
categories = ["visualization", "gui"]

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
global-hotkey = "0.8"
pollster = "0.4"
rfd = "0.17"
thiserror = "2"
tray-icon = "0.24"
wgpu = "30"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Reading the system reduce-motion setting. Both NSWorkspace calls Flourish
# needs are safe bindings, so this does not cost the crate its forbid(unsafe).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSWorkspace",
] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
