[package]
name = "flourish"
version = "0.1.0"
edition = "2024"
description = "A lightweight runner for presentation flourishes"
license = "MIT"
repository = "https://github.com/candrews/flourish"

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.4"
thiserror = "2"
tray-icon = "0.24"
wgpu = "30"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
